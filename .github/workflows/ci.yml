name: Plugin CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the marketplace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.7"

      - name: Verify manifests, paths, parity contract, PyPI, and MCP Registry
        run: python scripts/verify_plugin.py --live

      - name: Prove the packaged stdio transport
        run: uv run --isolated --python 3.12 --with "mcp>=1.0.0" python scripts/mcp_smoke.py
