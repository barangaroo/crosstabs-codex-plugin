name: Plugin CI

on:
  push:
    branches: [main]
    tags: [v0.2.5]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the marketplace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Verify source release and separate directory states
        run: python scripts/verify_plugin.py

      - name: Install pinned smoke-test dependencies
        run: python -m pip install "mcp==1.29.0" "uv==0.11.7" "packaging==26.2"

      - name: Run release-state and SDK regression tests
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Smoke both exact published package entrypoints
        run: python scripts/mcp_smoke.py

      - name: Compile Python verification scripts
        run: python -m py_compile scripts/verify_plugin.py scripts/mcp_smoke.py

      - name: Validate the Claude plugin package
        run: npx --yes @anthropic-ai/claude-code@2.1.201 plugin validate --strict plugins/crosstabs
